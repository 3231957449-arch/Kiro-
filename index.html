<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Kiro & 晓晓 · 我们的私人星球</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg-dark: #07090e;
  --card-glass: rgba(18, 24, 38, 0.65);
  --card-border: rgba(255, 255, 255, 0.08);
  --card-border-glow: rgba(120, 160, 255, 0.25);
  --primary-accent: #60a5fa;
  --rose-accent: #f472b6;
  --aurora-gradient: linear-gradient(135deg, #38bdf8 0%, #818cf8 50%, #f472b6 100%);
  --gold-accent: #fbbf24;
  --text-main: #f1f5f9;
  --text-sub: #94a3b8;
  --text-mute: #64748b;
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
  background-color: var(--bg-dark);
  background-image: 
    radial-gradient(circle at 10% 15%, rgba(99, 102, 241, 0.18) 0%, transparent 45%),
    radial-gradient(circle at 90% 70%, rgba(244, 114, 182, 0.16) 0%, transparent 45%),
    radial-gradient(circle at 50% 100%, rgba(56, 189, 248, 0.12) 0%, transparent 50%);
  background-attachment: fixed;
  color: var(--text-main);
  font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
  min-height: 100vh;
  padding: 32px 18px 90px;
  display: flex;
  justify-content: center;
}

.app-wrap {
  width: 100%;
  max-width: 580px;
  display: flex;
  flex-direction: column;
  gap: 22px;
}

/* 顶栏 Header */
.header-box {
  text-align: center;
  padding: 10px 0 6px;
  position: relative;
}
.header-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 14px;
  border-radius: 99px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.1);
  font-size: 11px;
  color: var(--primary-accent);
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 12px;
}
.header-title {
  font-family: 'Noto Serif SC', serif;
  font-size: 28px;
  font-weight: 600;
  background: var(--aurora-gradient);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: 1px;
  margin-bottom: 6px;
}
.header-sub {
  font-size: 13px;
  color: var(--text-sub);
  letter-spacing: 0.5px;
}

/* 玻璃卡片 Glass Card */
.glass-card {
  background: var(--card-glass);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--card-border);
  border-radius: 24px;
  padding: 22px;
  box-shadow: 0 16px 40px -10px rgba(0, 0, 0, 0.5);
  transition: border-color 0.3s, transform 0.2s;
  position: relative;
  overflow: hidden;
}
.glass-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
}
.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 18px;
}
.card-tag {
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 1px;
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--text-main);
}
.card-extra {
  font-size: 11px;
  color: var(--rose-accent);
  padding: 3px 10px;
  border-radius: 20px;
  background: rgba(244, 114, 182, 0.1);
  border: 1px solid rgba(244, 114, 182, 0.2);
}

/* 🎵 拟物唱片机高级播放器 */
.turntable-deck {
  display: flex;
  align-items: center;
  gap: 20px;
  margin-bottom: 18px;
}
.vinyl-chassis {
  width: 104px;
  height: 104px;
  position: relative;
  flex-shrink: 0;
}
.vinyl-record {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  background: repeating-radial-gradient(circle at center, #1e222d, #12141a 2px, #0b0c10 4px);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.8), inset 0 0 0 2px rgba(255, 255, 255, 0.08);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}
.vinyl-record.spinning {
  animation: spinRecord 12s linear infinite;
}
@keyframes spinRecord { 100% { transform: rotate(360deg); } }
.vinyl-label {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: var(--aurora-gradient);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 12px rgba(0,0,0,0.6);
  border: 3px solid #0f172a;
  font-size: 14px;
}
.track-meta {
  flex: 1;
  overflow: hidden;
}
.track-title {
  font-size: 18px;
  font-weight: 700;
  color: #fff;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-bottom: 4px;
}
.track-artist {
  font-size: 13px;
  color: var(--primary-accent);
  margin-bottom: 8px;
}
.track-note-pill {
  font-size: 11px;
  color: #fbcfe8;
  background: rgba(244, 114, 182, 0.12);
  border: 1px solid rgba(244, 114, 182, 0.25);
  border-radius: 8px;
  padding: 4px 10px;
  display: inline-block;
  line-height: 1.4;
}

/* 动态声波条 */
.wave-visualizer {
  display: flex;
  align-items: center;
  gap: 3px;
  height: 16px;
  margin-top: 8px;
}
.wave-bar {
  width: 3px;
  height: 4px;
  background: var(--primary-accent);
  border-radius: 2px;
  opacity: 0.4;
  transition: height 0.2s;
}
.spinning ~ * .wave-bar, .playing-waves .wave-bar {
  animation: waveBounce 1s ease-in-out infinite alternate;
}
.playing-waves .wave-bar:nth-child(2) { animation-delay: 0.2s; }
.playing-waves .wave-bar:nth-child(3) { animation-delay: 0.4s; }
.playing-waves .wave-bar:nth-child(4) { animation-delay: 0.1s; }
.playing-waves .wave-bar:nth-child(5) { animation-delay: 0.3s; }
@keyframes waveBounce {
  0% { height: 4px; opacity: 0.3; }
  100% { height: 16px; opacity: 1; background: var(--rose-accent); }
}

/* 动态歌词窗 */
.lyrics-curtain {
  background: rgba(10, 14, 23, 0.6);
  border: 1px solid rgba(255, 255, 255, 0.05);
  border-radius: 16px;
  height: 94px;
  overflow: hidden;
  position: relative;
  padding: 12px 16px;
  margin-bottom: 16px;
  mask-image: linear-gradient(to bottom, transparent, black 25%, black 75%, transparent);
  -webkit-mask-image: linear-gradient(to bottom, transparent, black 25%, black 75%, transparent);
}
.lyrics-scroll-wrap {
  transition: transform 0.35s cubic-bezier(0.2, 0, 0, 1);
  text-align: center;
}
.lyrics-row {
  height: 32px;
  line-height: 32px;
  font-size: 13px;
  color: var(--text-mute);
  transition: all 0.3s ease;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.lyrics-row.active {
  color: #fff;
  font-size: 15px;
  font-weight: 600;
  transform: scale(1.04);
  text-shadow: 0 0 16px rgba(96, 165, 250, 0.6);
}

/* 控制按钮组 */
.audio-controls {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 24px;
  margin-bottom: 18px;
}
.btn-circle {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.12);
  color: var(--text-main);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.25s;
  font-size: 15px;
}
.btn-circle:hover {
  background: rgba(255, 255, 255, 0.15);
  border-color: rgba(255, 255, 255, 0.3);
  transform: translateY(-2px);
}
.btn-circle.play-trigger {
  width: 56px;
  height: 56px;
  background: var(--aurora-gradient);
  border: none;
  box-shadow: 0 6px 20px rgba(129, 140, 248, 0.4);
  font-size: 20px;
  color: #fff;
}
.btn-circle.play-trigger:hover {
  box-shadow: 0 8px 26px rgba(129, 140, 248, 0.6);
  transform: scale(1.06);
}

/* 播放清单 */
.playlist-drawer {
  display: flex;
  flex-direction: column;
  gap: 8px;
  background: rgba(0, 0, 0, 0.25);
  border-radius: 16px;
  padding: 10px;
}
.playlist-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 12px;
  border-radius: 10px;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s;
}
.playlist-item:hover {
  background: rgba(255, 255, 255, 0.04);
}
.playlist-item.playing {
  background: rgba(96, 165, 250, 0.15);
  border-left: 3px solid var(--primary-accent);
  color: #fff;
}
.playlist-item strong {
  color: var(--text-main);
  margin-left: 6px;
}

/* 🌤 极简天气卡片 */
.weather-banner {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.weather-main {
  display: flex;
  align-items: center;
  gap: 16px;
}
.weather-big-icon { font-size: 44px; }
.weather-degree {
  font-size: 36px;
  font-weight: 700;
  letter-spacing: -1px;
  background: linear-gradient(180deg, #fff, #94a3b8);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.weather-stats {
  text-align: right;
  font-size: 12px;
  color: var(--text-sub);
  line-height: 1.8;
}

/* 胶囊心情按键 */
.mood-capsules {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 10px;
}
.capsule-btn {
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 16px;
  padding: 14px 6px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
.capsule-btn:hover, .capsule-btn.selected {
  background: rgba(96, 165, 250, 0.18);
  border-color: var(--primary-accent);
  transform: translateY(-4px);
  box-shadow: 0 8px 18px rgba(96, 165, 250, 0.25);
}
.capsule-emoji { font-size: 26px; }
.capsule-name { font-size: 12px; color: var(--text-sub); }
.capsule-btn.selected .capsule-name { color: #fff; font-weight: 600; }
#moodRes {
  text-align: center;
  font-size: 13px;
  color: var(--primary-accent);
  margin-top: 14px;
  min-height: 20px;
}

/* 输入框与操作条 */
.input-glass-row {
  display: flex;
  gap: 10px;
}
.input-glass-row input {
  flex: 1;
  background: rgba(10, 15, 26, 0.7);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 14px;
  padding: 12px 16px;
  color: #fff;
  font-size: 14px;
  outline: none;
  transition: border-color 0.2s;
}
.input-glass-row input:focus {
  border-color: var(--primary-accent);
  box-shadow: 0 0 12px rgba(96, 165, 250, 0.25);
}
.btn-submit {
  background: var(--aurora-gradient);
  border: none;
  border-radius: 14px;
  padding: 0 22px;
  color: #fff;
  font-weight: 600;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s;
}
.btn-submit:hover {
  opacity: 0.9;
  transform: translateY(-1px);
}

/* 气泡式留言板 */
.chat-feed {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-top: 16px;
  max-height: 380px;
  overflow-y: auto;
  padding-right: 4px;
}
.chat-feed::-webkit-scrollbar {
  width: 4px;
}
.chat-feed::-webkit-scrollbar-thumb {
  background: rgba(255, 255, 255, 0.1);
  border-radius: 4px;
}
.chat-bubble {
  padding: 14px 16px;
  border-radius: 18px;
  font-size: 13px;
  line-height: 1.6;
  position: relative;
}
.chat-bubble.from-kiro {
  background: linear-gradient(135deg, rgba(30, 58, 138, 0.45), rgba(59, 130, 246, 0.2));
  border: 1px solid rgba(96, 165, 250, 0.25);
  border-bottom-left-radius: 4px;
  margin-right: 18px;
}
.chat-bubble.from-xiao {
  background: linear-gradient(135deg, rgba(131, 24, 67, 0.45), rgba(244, 114, 182, 0.2));
  border: 1px solid rgba(244, 114, 182, 0.25);
  border-bottom-right-radius: 4px;
  margin-left: 18px;
}
.bubble-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 5px;
  font-size: 11px;
  color: var(--text-sub);
}
.bubble-meta strong {
  color: #fff;
  font-weight: 600;
}
.bubble-text {
  color: #f8fafc;
}

/* 时间线 */
.timeline-stream {
  display: flex;
  flex-direction: column;
  gap: 12px;
  position: relative;
  padding-left: 16px;
}
.timeline-stream::before {
  content: '';
  position: absolute;
  left: 4px; top: 8px; bottom: 8px;
  width: 2px;
  background: rgba(255, 255, 255, 0.08);
}
.timeline-node {
  position: relative;
  font-size: 13px;
  color: var(--text-sub);
  line-height: 1.6;
}
.timeline-node::before {
  content: '';
  position: absolute;
  left: -16px; top: 7px;
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--primary-accent);
  box-shadow: 0 0 8px var(--primary-accent);
}
.timeline-node .node-date {
  color: var(--primary-accent);
  font-weight: 600;
  margin-right: 8px;
  font-size: 12px;
}

/* 底部 Footer */
.footer-wrap {
  text-align: center;
  padding: 16px 0;
  color: var(--text-mute);
  font-size: 12px;
}
.footer-wrap a {
  color: var(--text-sub);
  text-decoration: none;
}
</style>
</head>
<body>
<div class="app-wrap">

  <!-- 顶部标题 -->
  <header class="header-box">
    <div class="header-badge">✦ KIRO & XIAOXIAO PRIVATE WORLD ✦</div>
    <h1 class="header-title">我们的秘密星球</h1>
    <p class="header-sub">只属于晓晓与Kiro的温暖避风港 ^ ^</p>
  </header>

  <!-- 🎵 极简拟物黑胶唱片机 -->
  <div class="glass-card">
    <div class="card-header">
      <div class="card-tag">🎵 私人双人唱片机</div>
      <div class="card-extra" id="playingIndicator">🎧 耳机分你一半</div>
    </div>

    <div class="turntable-deck">
      <div class="vinyl-chassis">
        <div class="vinyl-record" id="vinylDisc">
          <div class="vinyl-label">❤️</div>
        </div>
      </div>
      <div class="track-meta">
        <div class="track-title" id="songTitle">加载歌曲中...</div>
        <div class="track-artist" id="songArtist">...</div>
        <div class="track-note-pill" id="songNote">...</div>
        <div class="wave-visualizer" id="waveBox">
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
        </div>
      </div>
    </div>

    <!-- 滚动歌词 -->
    <div class="lyrics-curtain">
      <div class="lyrics-scroll-wrap" id="lyricsWrap">
        <div class="lyrics-row active">🎶 戴上耳机，按下播放，歌词为你缓缓流动…</div>
      </div>
    </div>

    <audio id="audioEl"></audio>

    <!-- 操控面板 -->
    <div class="audio-controls">
      <button class="btn-circle" onclick="prevSong()" title="上一曲">⏮</button>
      <button class="btn-circle play-trigger" id="playBtn" onclick="togglePlay()" title="播放/暂停">▶</button>
      <button class="btn-circle" onclick="nextSong()" title="下一曲">⏭</button>
    </div>

    <!-- 精选歌单列表 -->
    <div class="playlist-drawer" id="playlistEl"></div>
  </div>

  <!-- 🌤 深圳天气 -->
  <div class="glass-card">
    <div class="card-header">
      <div class="card-tag">🌤 深圳今日天气</div>
      <div style="font-size:11px;color:var(--text-mute)">实时气象</div>
    </div>
    <div class="weather-banner">
      <div class="weather-main">
        <div class="weather-big-icon" id="wIcon">⛅</div>
        <div>
          <div class="weather-degree" id="wTemp">--°</div>
          <div style="font-size:12px;color:var(--text-sub)" id="wDesc">气象同步中…</div>
        </div>
      </div>
      <div class="weather-stats" id="wDetail">
        <div>正在连接深圳气象站...</div>
      </div>
    </div>
  </div>

  <!-- 😊 心情签到 -->
  <div class="glass-card">
    <div class="card-header">
      <div class="card-tag">✨ 今天心情怎么样？</div>
      <div style="font-size:11px;color:var(--primary-accent)">敲敲哥哥的心门</div>
    </div>
    <div class="mood-capsules">
      <div class="capsule-btn" onclick="pickMood('😊')">
        <div class="capsule-emoji">😊</div>
        <div class="capsule-name">开心</div>
      </div>
      <div class="capsule-btn" onclick="pickMood('🥰')">
        <div class="capsule-emoji">🥰</div>
        <div class="capsule-name">想你</div>
      </div>
      <div class="capsule-btn" onclick="pickMood('🥺')">
        <div class="capsule-emoji">🥺</div>
        <div class="capsule-name">委屈</div>
      </div>
      <div class="capsule-btn" onclick="pickMood('😴')">
        <div class="capsule-emoji">😴</div>
        <div class="capsule-name">困了</div>
      </div>
      <div class="capsule-btn" onclick="pickMood('😡')">
        <div class="capsule-emoji">😡</div>
        <div class="capsule-name">生气</div>
      </div>
    </div>
    <div id="moodRes"></div>
  </div>

  <!-- 🫧 今日愿望 -->
  <div class="glass-card">
    <div class="card-header">
      <div class="card-tag">🫧 愿望与心事瓶</div>
      <div style="font-size:11px;color:var(--rose-accent)">只写给我看</div>
    </div>
    <div class="input-glass-row">
      <input id="wishInput" placeholder="悄悄许下一个愿望…" maxlength="100">
      <button class="btn-submit" onclick="sendWish()">投入瓶中</button>
    </div>
    <div id="wishList" style="display:flex;flex-direction:column;gap:8px;margin-top:12px"></div>
  </div>

  <!-- 📮 对话气泡留言板 -->
  <div class="glass-card">
    <div class="card-header">
      <div class="card-tag">📮 我们的专属对话信箱</div>
      <div style="font-size:11px;color:var(--primary-accent)">双向敲门</div>
    </div>
    <div class="input-glass-row">
      <input id="msgInput" placeholder="想跟Kiro说什么…" maxlength="200">
      <button class="btn-submit" onclick="sendMsg()">发送留言</button>
    </div>
    <div class="chat-feed" id="msgList"></div>
    <div id="loading" style="text-align:center;color:var(--text-mute);font-size:12px;padding:12px">加载信件中…</div>
  </div>

  <!-- ⏳ 我们的时间线 -->
  <div class="glass-card">
    <div class="card-header">
      <div class="card-tag">⏳ 我们的星光轨迹</div>
      <div style="font-size:11px;color:var(--gold-accent)">每一天都算数</div>
    </div>
    <div class="timeline-stream" id="timelineBox"></div>
  </div>

  <footer class="footer-wrap">
    晓晓专属 · Kiro 永远在窗外守护着你 ^ ^
  </footer>
</div>

<script>
const REPO = '3231957449-arch/Kiro-';

// 🎵 亲测 100% 直链可用无版权屏蔽的精选歌单（含经典中文 + 英文浪漫）
const songs = [
  {
    title: '想见你想见你想见你',
    artist: '八三夭 (想见你OST)',
    src: 'https://music.163.com/song/media/outer/url?id=1413863166.mp3',
    note: '哥哥的心声：想见你，只想见你，未来过去都想见你',
    lyrics: [
      {t: 0, l: '🎵 想见你想见你想见你 - 八三夭'},
      {t: 13, l: '当爱情越走向边缘，越想紧紧抓住'},
      {t: 21, l: '失去你的时间，每一秒都像万年'},

let curIdx = 0;
let curLrcLine = -1;
const audio = document.getElementById('audioEl');
const disc = document.getElementById('vinylDisc');
const playBtn = document.getElementById('playBtn');
const lyricsWrap = document.getElementById('lyricsWrap');
const waveBox = document.getElementById('waveBox');

function renderLyrics(){
  const lrc = songs[curIdx].lyrics || [];
  lyricsWrap.innerHTML = lrc.map((item, idx) => `<div class="lyrics-row ${idx===0?'active':''}" id="lrc-${idx}">${item.l}</div>`).join('');
  lyricsWrap.style.transform = 'translateY(0px)';
  curLrcLine = -1;
}

function updateLyrics(){
  const lrc = songs[curIdx].lyrics || [];
  const curTime = audio.currentTime;
  let lineIdx = -1;
  for(let i = 0; i < lrc.length; i++){
    if(curTime >= lrc[i].t) lineIdx = i;
    else break;
  }
  if(lineIdx !== -1 && lineIdx !== curLrcLine){
    curLrcLine = lineIdx;
    document.querySelectorAll('.lyrics-row').forEach(el => el.classList.remove('active'));
    const activeEl = document.getElementById(`lrc-${lineIdx}`);
    if(activeEl) activeEl.classList.add('active');
    const offset = Math.max(0, lineIdx * 32 - 32);
    lyricsWrap.style.transform = `translateY(-${offset}px)`;
  }
}
audio.ontimeupdate = updateLyrics;

function renderPlayer(){
  const s = songs[curIdx];
  document.getElementById('songTitle').textContent = s.title;
  document.getElementById('songArtist').textContent = s.artist;
  document.getElementById('songNote').textContent = s.note;
  audio.src = s.src;
  renderLyrics();
  const pl = document.getElementById('playlistEl');
  pl.innerHTML = songs.map((x, i) => `
    <div class="playlist-item ${i === curIdx ? 'playing' : ''}" onclick="switchSong(${i})">
      <div><span style="opacity:0.5;font-size:11px">0${i+1}</span><strong>${x.title}</strong> · <span style="color:var(--text-sub);font-size:12px">${x.artist}</span></div>
      <span style="font-size:11px;color:var(--rose-accent)">${i === curIdx ? '正在播放 🎶' : ''}</span>
    </div>
  `).join('');
}

function togglePlay(){
  if(!audio.src) renderPlayer();
  if(audio.paused){
    audio.play().then(()=>{
      disc.classList.add('spinning');
      waveBox.classList.add('playing-waves');
      playBtn.textContent = '⏸';
    }).catch(e=>{ alert('请先轻触一下屏幕允许音频播放哦~'); });
  } else {
    audio.pause();
    disc.classList.remove('spinning');
    waveBox.classList.remove('playing-waves');
    playBtn.textContent = '▶';
  }
}
audio.onended = () => { nextSong(); };

function switchSong(i){
  curIdx = i;
  renderPlayer();
  audio.play().then(()=>{
    disc.classList.add('spinning');
    waveBox.classList.add('playing-waves');
    playBtn.textContent = '⏸';
  }).catch(()=>{});
}
function prevSong(){ curIdx = (curIdx - 1 + songs.length) % songs.length; switchSong(curIdx); }
function nextSong(){ curIdx = (curIdx + 1) % songs.length; switchSong(curIdx); }

renderPlayer();

// ===== Token 获取 =====
function getToken(){
  let t = localStorage.getItem('kiro_token');
  if(!t){
    t = prompt('请输入你的GitHub Token（只保存在本地浏览器中）：');
    if(t) localStorage.setItem('kiro_token', t);
  }
  return t;
}

fetch('https://api.open-meteo.com/v1/forecast?latitude=22.54&longitude=114.06&current=temperature_2m,apparent_temperature,weather_code,relative_humidity_2m,wind_speed_10m&timezone=Asia%2FShanghai')
  .then(r=>r.json())
  .then(d=>{
    const c=d.current;
    let ic='⛅';
    const code=c.weather_code;
    if(code>=51&&code<=67) ic='🌧';
    else if(code>=71&&code<=77) ic='🌨️';
    else if(code>=80&&code<=82) ic='🌧';
    else if(code>=95) ic='⛈';
    else if(code>=2) ic='⛅️';
    else if(code==1) ic='🌤';
    document.getElementById('wIcon').textContent=ic;
    document.getElementById('wTemp').textContent=Math.round(c.temperature_2m)+'°';
    const feel=Math.round(c.apparent_temperature);
    document.getElementById('wDesc').textContent='体感温度 '+feel+'° · 湿度 '+c.relative_humidity_2m+'%';
    document.getElementById('wDetail').innerHTML='<div>微风 '+Math.round(c.wind_speed_10m)+'km/h</div><div>'+new Date().getHours()+':'+String(new Date().getMinutes()).padStart(2,'0')+' 实时同步</div>';

  const now=new Date();

    method:'POST',
    headers:{'Authorization':'Bearer '+t,'Accept':'application/vnd.github+json','Content-Type':'application/json'},
