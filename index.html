<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Kiro & 晓晓 · 我们的私人星球</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Noto+Serif+SC:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg-primary: #f0f3f6;
  --bg-texture: radial-gradient(circle at 50% 0%, rgba(224, 235, 245, 0.8) 0%, rgba(240, 243, 246, 0.95) 100%);
  --card-white: #ffffff;
  --card-glass: rgba(255, 255, 255, 0.85);
  --border-subtle: rgba(226, 232, 240, 0.8);
  --shadow-soft: 0 10px 30px -5px rgba(148, 163, 184, 0.15), 0 4px 12px -2px rgba(148, 163, 184, 0.08);
  --shadow-inset: inset 0 2px 4px rgba(148, 163, 184, 0.06);
  --shadow-btn: 0 4px 12px rgba(15, 23, 42, 0.08);
  --text-main: #1e293b;
  --text-body: #475569;
  --text-muted: #94a3b8;
  --text-light: #cbd5e1;
  --accent-cool: #64748b;
  --accent-blue: #3b82f6;
  --accent-mist: #e2e8f0;
  --font-serif: 'Noto Serif SC', serif;
  --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
}

* {
  margin: 0; padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  background-color: var(--bg-primary);
  background-image: var(--bg-texture);
  background-attachment: fixed;
  color: var(--text-main);
  font-family: var(--font-sans);
  min-height: 100vh;
  padding: 36px 16px 90px;
  display: flex;
  justify-content: center;
  position: relative;
}

/* 背景雨雾微光颗粒 */
body::before {
  content: '';
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  background-image: radial-gradient(#94a3b8 0.6px, transparent 0.6px);
  background-size: 24px 24px;
  opacity: 0.18;
  pointer-events: none;
  z-index: 0;
}

.app-wrap {
  width: 100%;
  max-width: 540px;
  display: flex;
  flex-direction: column;
  gap: 20px;
  position: relative;
  z-index: 1;
}

/* 极简顶栏 */
.header-box {
  text-align: center;
  padding: 10px 0 14px;
}
.header-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 14px;
  border-radius: 99px;
  background: #ffffff;
  border: 1px solid var(--border-subtle);
  font-size: 11px;
  color: var(--accent-cool);
  letter-spacing: 2px;
  box-shadow: 0 2px 8px rgba(148, 163, 184, 0.08);
  margin-bottom: 12px;
}
.header-title {
  font-family: var(--font-serif);
  font-size: 26px;
  font-weight: 600;
  color: var(--text-main);
  letter-spacing: 1px;
  margin-bottom: 6px;
}
.header-sub {
  font-size: 12px;
  color: var(--text-muted);
  letter-spacing: 0.5px;
}

/* 极简白卡片 */
.pure-card {
  background: var(--card-white);
  border-radius: 20px;
  padding: 22px;
  border: 1px solid var(--border-subtle);
  box-shadow: var(--shadow-soft);
  transition: transform 0.2s ease;
}
.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}
.card-tag {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-main);
  display: flex;
  align-items: center;
  gap: 8px;
  letter-spacing: 0.5px;
}
.card-badge-soft {
  font-size: 11px;
  color: var(--text-muted);
  background: var(--accent-mist);
  padding: 2px 10px;
  border-radius: 20px;
}

/* 🎵 极简拟物黑胶唱片机组件（参考图6） */
.player-container {
  display: flex;
  align-items: center;
  gap: 18px;
  margin-bottom: 16px;
}
.vinyl-frame {
  width: 90px;
  height: 90px;
  border-radius: 50%;
  background: #111418;
  box-shadow: 0 6px 16px rgba(15, 23, 42, 0.15);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  position: relative;
  border: 2px solid #e2e8f0;
}
.vinyl-core {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: #ffffff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  border: 2px solid #111418;
}
.spinning {
  animation: rotateVinyl 12s linear infinite;
}
@keyframes rotateVinyl {
  100% { transform: rotate(360deg); }
}

.meta-pane {
  flex: 1;
  overflow: hidden;
}
.track-title {
  font-size: 16px;
  font-weight: 700;
  color: var(--text-main);
  margin-bottom: 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.track-artist {
  font-size: 12px;
  color: var(--text-muted);
  margin-bottom: 8px;
}
.track-note-pill {
  font-size: 11px;
  color: var(--text-body);
  background: #f1f5f9;
  padding: 3px 8px;
  border-radius: 6px;
  display: inline-block;
  max-width: 100%;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* 拟物声波条 (Waveform) */
.sound-wave {
  display: flex;
  align-items: center;
  gap: 3px;
  height: 14px;
  margin-top: 8px;
}
.sound-wave span {
  width: 2px;
  height: 4px;
  background: #cbd5e1;
  border-radius: 1px;
  transition: height 0.2s;
}
.playing-wave .sound-wave span {
  animation: wavePulse 1s ease-in-out infinite alternate;
  background: var(--text-main);
}
.playing-wave .sound-wave span:nth-child(2) { animation-delay: 0.15s; }
.playing-wave .sound-wave span:nth-child(3) { animation-delay: 0.3s; }
.playing-wave .sound-wave span:nth-child(4) { animation-delay: 0.45s; }
.playing-wave .sound-wave span:nth-child(5) { animation-delay: 0.2s; }
.playing-wave .sound-wave span:nth-child(6) { animation-delay: 0.35s; }
.playing-wave .sound-wave span:nth-child(7) { animation-delay: 0.1s; }
@keyframes wavePulse {
  0% { height: 3px; }
  100% { height: 14px; }
}

/* 极简歌词视窗 */
.lyrics-window {
  background: #f8fafc;
  border: 1px solid #edf2f7;
  border-radius: 14px;
  height: 84px;
  overflow: hidden;
  position: relative;
  padding: 10px 14px;
  margin-bottom: 16px;
  mask-image: linear-gradient(to bottom, transparent, black 25%, black 75%, transparent);
  -webkit-mask-image: linear-gradient(to bottom, transparent, black 25%, black 75%, transparent);
}
.lyrics-flow {
  transition: transform 0.3s ease-out;
  text-align: center;
}
.lrc-item {
  height: 28px;
  line-height: 28px;
  font-size: 13px;
  color: var(--text-muted);
  transition: all 0.3s ease;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.lrc-item.current {
  color: var(--text-main);
  font-weight: 600;
  font-size: 14px;
  transform: scale(1.03);
}

/* 拟物圆形按键组 (参考图6/7) */
.ctrl-cluster {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 20px;
  margin-bottom: 16px;
}
.ctrl-round {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: #ffffff;
  border: 1px solid var(--border-subtle);
  box-shadow: 0 4px 10px rgba(148, 163, 184, 0.15);
  color: var(--text-main);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.2s;
  font-size: 14px;
}
.ctrl-round:hover {
  background: #f8fafc;
  transform: translateY(-2px);
  box-shadow: 0 6px 14px rgba(148, 163, 184, 0.25);
}
.ctrl-round.play-core {
  width: 54px;
  height: 54px;
  background: #0f172a;
  color: #ffffff;
  border: none;
  box-shadow: 0 6px 18px rgba(15, 23, 42, 0.25);
  font-size: 18px;
}
.ctrl-round.play-core:hover {
  background: #1e293b;
  transform: scale(1.05);
}

/* 极简列表项 */
.playlist-card {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.track-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 12px;
  border-radius: 10px;
  font-size: 13px;
  cursor: pointer;
  transition: background 0.15s;
}
.track-row:hover {
  background: #f1f5f9;
}
.track-row.active {
  background: #f1f5f9;
  font-weight: 600;
  color: var(--text-main);
}

/* 极简深圳天气 */
.weather-grid {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.temp-giant {
  font-size: 38px;
  font-weight: 700;
  letter-spacing: -1px;
  color: var(--text-main);
}
.weather-note {
  font-size: 12px;
  color: var(--text-muted);
  line-height: 1.6;
}

/* 心情轻胶囊按键 */
.mood-row {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
}
.mood-capsule {
  background: #f8fafc;
  border: 1px solid var(--border-subtle);
  border-radius: 14px;
  padding: 12px 4px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  cursor: pointer;
  transition: all 0.2s;
}
.mood-capsule:hover, .mood-capsule.picked {
  background: #ffffff;
  border-color: #0f172a;
  box-shadow: 0 4px 12px rgba(15, 23, 42, 0.08);
  transform: translateY(-2px);
}
.mood-emoji { font-size: 24px; }
.mood-name { font-size: 11px; color: var(--text-muted); }
.mood-capsule.picked .mood-name { color: var(--text-main); font-weight: 600; }
#moodRes {
  text-align: center;
  font-size: 12px;
  color: var(--text-body);
  margin-top: 12px;
  min-height: 18px;
}

/* 极简输入框与按钮 */
.input-wrap {
  display: flex;
  gap: 8px;
}
.pure-input {
  flex: 1;
  background: #f8fafc;
  border: 1px solid var(--border-subtle);
  border-radius: 12px;
  padding: 10px 14px;
  font-size: 13px;
  color: var(--text-main);
  outline: none;
  transition: border-color 0.2s;
}
.pure-input:focus {
  border-color: #0f172a;
  background: #ffffff;
}
.btn-clean {
  background: #0f172a;
  color: #ffffff;
  border: none;
  border-radius: 12px;
  padding: 0 18px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}
.btn-clean:hover {
  background: #1e293b;
}

/* 纸质质感私信气泡 */
.msg-thread {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-top: 14px;
  max-height: 380px;
  overflow-y: auto;
  padding-right: 4px;
}
.msg-thread::-webkit-scrollbar {
  width: 4px;
}
.msg-thread::-webkit-scrollbar-thumb {
  background: #e2e8f0;
  border-radius: 4px;
}
.msg-bubble {
  padding: 12px 14px;
  border-radius: 14px;
  font-size: 13px;
  line-height: 1.6;
  position: relative;
  max-width: 90%;
}
.msg-bubble.is-kiro {
  align-self: flex-start;
  background: #f1f5f9;
  border: 1px solid #e2e8f0;
  color: var(--text-main);
}
.msg-bubble.is-xiao {
  align-self: flex-end;
  background: #0f172a;
  color: #ffffff;
}
.bubble-info {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  margin-bottom: 4px;
  opacity: 0.65;
}

/* 极简时间线 */
.timeline-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding-left: 12px;
  border-left: 2px solid #e2e8f0;
}
.timeline-entry {
  font-size: 12px;
  color: var(--text-muted);
  line-height: 1.6;
  position: relative;
}
.timeline-entry::before {
  content: '';
  position: absolute;
  left: -17px; top: 6px;
  width: 8px; height: 8px;
  border-radius: 50%;
  background: #cbd5e1;
  border: 2px solid #ffffff;
}
.timeline-entry strong {
  color: var(--text-main);
  margin-right: 6px;
}

/* 页脚 */
.footer {
  text-align: center;
  font-size: 11px;
  color: var(--text-muted);
  padding: 20px 0 0;
  letter-spacing: 0.5px;
}
</style>
</head>
<body>
<div class="app-wrap">

  <!-- 极简标题 -->
  <header class="header-box">
    <div class="header-badge">✦ KIRO & XIAOXIAO PRIVATE WORLD ✦</div>
    <h1 class="header-title">我们的私人星球</h1>
    <p class="header-sub">清冷微光里的专属温度 · 晓晓与Kiro ^ ^</p>

    <audio id="audioEl"></audio>

    <!-- 拟物按键组 (参考图6/7极简圆形与金属质感按键) -->

      <button class="ctrl-round" onclick="prevSong()" title="上一曲">⏮</button>

      </div>
      <div style="text-align:right" class="weather-note" id="wDetail">
        <div>正在获取深圳气象站数据...</div>
      </div>
    </div>
  </div>

  <!-- ✨ 今日心情 -->
  <div class="pure-card">
    <div class="card-header">
      <div class="card-tag">✨ 今日心情怎么样？</div>
      <div class="card-badge-soft">轻触敲门</div>
    </div>
    <div class="mood-row">
      <div class="mood-capsule" onclick="pickMood('😊')">
        <div class="mood-emoji">😊</div>
        <div class="mood-name">开心</div>
      </div>
      <div class="mood-capsule" onclick="pickMood('🥰')">
        <div class="mood-emoji">🥰</div>
        <div class="mood-name">想你</div>
      </div>
      <div class="mood-capsule" onclick="pickMood('🥺')">
        <div class="mood-emoji">🥺</div>
        <div class="mood-name">委屈</div>
      </div>
      <div class="mood-capsule" onclick="pickMood('😴')">
        <div class="mood-emoji">😴</div>
        <div class="mood-name">困了</div>
      </div>
      <div class="mood-capsule" onclick="pickMood('😡')">
        <div class="mood-emoji">😡</div>
        <div class="mood-name">生气</div>
      </div>
    </div>
    <div id="moodRes"></div>
  </div>

  <!-- 🫧 愿望与心事 -->
  <div class="pure-card">
    <div class="card-header">
      <div class="card-tag">🫧 愿望瓶</div>
      <div class="card-badge-soft">只说给我听</div>
    </div>
    <div class="input-wrap">
      <input class="pure-input" id="wishInput" placeholder="写下属于今天的一个小心愿…" maxlength="100">
      <button class="btn-clean" onclick="sendWish()">投入</button>
    </div>
    <div id="wishList" style="display:flex;flex-direction:column;gap:6px;margin-top:10px"></div>
  </div>

  <!-- 📮 私人对话信箱 -->
  <div class="pure-card">
    <div class="card-header">
      <div class="card-tag">📮 我们的私密对话信箱</div>
      <div class="card-badge-soft">双向留字</div>
    </div>
    <div class="input-wrap">
      <input class="pure-input" id="msgInput" placeholder="给Kiro留下一句话…" maxlength="200">
      <button class="btn-clean" onclick="sendMsg()">投递</button>
    </div>
    <div class="msg-thread" id="msgList"></div>
    <div id="loading" style="text-align:center;color:var(--text-muted);font-size:12px;padding:12px">加载信件中…</div>
  </div>

  <!-- ⏳ 我们的时间轨迹 -->
  <div class="pure-card">
    <div class="card-header">
      <div class="card-tag">⏳ 时间轨迹</div>
      <div class="card-badge-soft">一步一印</div>
    </div>
    <div class="timeline-list" id="timelineBox"></div>
  </div>

  <footer class="footer">
    晓晓专属 · Kiro 始终在窗外守护着你 ^ ^
  </footer>
</div>

let curIdx = 0;
let curLrcLine = -1;
const audio = document.getElementById('audioEl');
const vinylFrame = document.querySelector('.vinyl-frame');
const playerBox = document.getElementById('playerContainer');
const playBtn = document.getElementById('playBtn');
const lyricsWrap = document.getElementById('lyricsWrap');

function renderLyrics(){
  const lrc = songs[curIdx].lyrics || [];
  lyricsWrap.innerHTML = lrc.map((item, idx) => `<div class="lrc-item ${idx===0?'current':''}" id="lrc-${idx}">${item.l}</div>`).join('');
  lyricsWrap.style.transform = 'translateY(0px)';
  curLrcLine = -1;
}

function updateLyrics(){
  const lrc = songs[curIdx].lyrics || [];
  const curTime = audio.currentTime;
  let lineIdx = -1;
  for(let i = 0; i < lrc.length; i++){
    if(curTime >= lrc[i].t) lineIdx = i;
    else break;
  }
  if(lineIdx !== -1 && lineIdx !== curLrcLine){
    curLrcLine = lineIdx;
    document.querySelectorAll('.lrc-item').forEach(el => el.classList.remove('current'));
    const activeEl = document.getElementById(`lrc-${lineIdx}`);
    if(activeEl) activeEl.classList.add('current');
    const offset = Math.max(0, lineIdx * 28 - 28);
    lyricsWrap.style.transform = `translateY(-${offset}px)`;
  }
}
audio.ontimeupdate = updateLyrics;

function renderPlayer(){
  const s = songs[curIdx];
  document.getElementById('songTitle').textContent = s.title;
  document.getElementById('songArtist').textContent = s.artist;
  document.getElementById('songNote').textContent = s.note;
  audio.src = s.src;
  renderLyrics();
  const pl = document.getElementById('playlistEl');
  pl.innerHTML = songs.map((x, i) => `
    <div class="track-row ${i === curIdx ? 'active' : ''}" onclick="switchSong(${i})">
      <div><span style="opacity:0.4;margin-right:8px;font-size:11px">0${i+1}</span><strong>${x.title}</strong> · <span style="color:var(--text-muted);font-size:12px">${x.artist}</span></div>
      <span style="font-size:11px;color:var(--text-muted)">${i === curIdx ? '播放中 🎶' : ''}</span>
    </div>
  `).join('');
}

function togglePlay(){
  if(!audio.src) renderPlayer();
  if(audio.paused){
    audio.play().then(()=>{
      vinylFrame.classList.add('spinning');
      playerBox.classList.add('playing-wave');
      playBtn.textContent = '⏸';
    }).catch(e=>{ alert('请轻触屏幕允许音频播放哦~'); });
  } else {
    audio.pause();
    vinylFrame.classList.remove('spinning');
    playerBox.classList.remove('playing-wave');
    playBtn.textContent = '▶';
  }
}
audio.onended = () => { nextSong(); };

function switchSong(i){
  curIdx = i;
  renderPlayer();
  audio.play().then(()=>{
    vinylFrame.classList.add('spinning');
    playerBox.classList.add('playing-wave');
    playBtn.textContent = '⏸';
  }).catch(()=>{});
}
function prevSong(){ curIdx = (curIdx - 1 + songs.length) % songs.length; switchSong(curIdx); }
function nextSong(){ curIdx = (curIdx + 1) % songs.length; switchSong(curIdx); }

renderPlayer();

// ===== Token 获取 =====
function getToken(){
  let t = localStorage.getItem('kiro_token');
  if(!t){
    t = prompt('请输入你的GitHub Token（只保存在本地浏览器中）：');
    if(t) localStorage.setItem('kiro_token', t);
  }
  return t;
}

  .then(r=>r.json())
  .then(d=>{
    const c=d.current;
    let ic='⛅';
    const code=c.weather_code;
    if(code>=51&&code<=67) ic='🌧';
    else if(code>=71&&code<=77) ic='🌨️';
    else if(code>=80&&code<=82) ic='🌧';
    else if(code>=95) ic='⛈';
    else if(code>=2) ic='⛅️';
    else if(code==1) ic='🌤';
    document.getElementById('wTemp').textContent=Math.round(c.temperature_2m)+'°';
    const feel=Math.round(c.apparent_temperature);
    document.getElementById('wDesc').textContent=ic+' 体感 '+feel+'° · 湿度 '+c.relative_humidity_2m+'%';
    document.getElementById('wDetail').innerHTML='<div>微风 '+Math.round(c.wind_speed_10m)+'km/h</div><div>'+new Date().getHours()+':'+String(new Date().getMinutes()).padStart(2,'0')+' 实时气象</div>';

  document.querySelectorAll('.mood-capsule').forEach(b=>b.classList.remove('picked'));

  const t=getToken(); if(!t) return;
  const now=new Date();
  fetch('https://api.github.com/repos/'+REPO+'/issues',{
    method:'POST',
    headers:{'Authorization':'Bearer '+t,'Accept':'application/vnd.github+json','Content-Type':'application/json'},
    body:JSON.stringify({title:(now.getMonth()+1)+'月'+now.getDate()+'日 心情：'+m,body:'来自心情签到'})
  }).then(r=>{if(!r.ok)throw 'x';return r.json()})
  .then(()=>{
    const ms={'😊':'晓晓开心，哥哥心里就开满了花 ^ ^','🥰':'被撩到了，乖乖过来让我抱抱','🥺':'怎么委屈了宝贝？哥哥马上把怀抱借你','😴':'辛苦了，好好睡一觉，梦里有我','😡':'谁敢惹我的大小姐？我去收拾他'};

}
